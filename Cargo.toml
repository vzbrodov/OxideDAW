[workspace]
resolver = "2"
members = [
    "crates/oxide-core",
    "crates/oxide-audio",
    "crates/oxide-dsp",
    "crates/oxide-midi",
    "crates/oxide-plugin-sdk",
    "crates/oxide-mcp",
    "crates/oxide-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Vladislav Zbrodov <vzbrodov@users.noreply.github.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/vzbrodov/OxideDAW"

[workspace.dependencies]
# Audio & DSP
cpal = "0.15"
symphonia = { version = "0.5", default-features = false, features = ["wav", "mp3", "flac"] }
ringbuf = "0.4"

# Async & Networking / MCP
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging & Observability
tracing = "0.1"
tracing-subscriber = "0.3"
